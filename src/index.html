<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Website</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Welcome to the Task Website</h1>
        <h2 id="datetime-heading">Loading date and time...</h2>
    </header>

    <main>
        <section>
            <h2>About</h2>
            <p>This website is designed to help you manage your tasks efficiently.</p>
        </section>

        <section>
            <h2>Task Manager</h2>

            <form id="task-form">
                <input type="text" id="task-input" placeholder="Enter a task" required>
                <button type="submit">Add Task</button>
            </form>

            <ul id="task-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Task Website</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
